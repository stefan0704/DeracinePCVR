name: Build Windows PCVR

on:
  push:
    branches: [ main, master, optimizacion-graficos, actualizacion-v0.21.0 ]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  windows-sdl:
    name: Build shadPS4 Windows SDL
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Cache CMake Build
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('src/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Fetch Submodules
        run: python tools/fetch-submodules.py

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S src `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload Windows PCVR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-deracine-pcvr
          path: build/shadPS4.exe
